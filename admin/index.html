<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self'; img-src 'self' data: blob: https:; connect-src 'self' https://*.supabase.co wss://*.supabase.co; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'">
  <title>Dashboard · Admin</title>
  <script src="../js/theme-init.js"></script>
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/dashboard.css">
  <script type="module" src="../js/admin/app.js"></script>
</head>
<body class="admin auth-pending">
  <a class="skip-link" href="#main">Skip to content</a>

  <div class="auth-loader" role="status" aria-live="polite">
    <span class="spinner spinner--lg" aria-hidden="true"></span>
    <span>Checking your session…</span>
  </div>

  <div class="shell">
    <aside class="sidebar" id="sidebar" aria-label="Dashboard navigation">
      <div class="sidebar__brand">
        <a href="#/overview" class="sidebar__logo"><span aria-hidden="true">◆</span> Portfolio <small>Admin</small></a>
      </div>
      <nav class="sidebar__nav-wrap" aria-label="Sections">
        <ul class="sidebar__nav" id="sidebar-nav"></ul>
      </nav>
      <div class="sidebar__footer">
        <a class="sidebar__link" href="../index.html" target="_blank" rel="noopener">
          <span class="sidebar__icon" aria-hidden="true">↗</span><span>View site</span>
        </a>
        <button type="button" class="sidebar__link sidebar__logout" id="logout">
          <span class="sidebar__icon" aria-hidden="true">⎋</span><span>Log out</span>
        </button>
      </div>
    </aside>
    <div class="sidebar-backdrop" id="sidebar-backdrop" hidden></div>

    <div class="shell__main">
      <header class="topbar">
        <button type="button" class="icon-btn topbar__menu" id="menu-toggle" aria-controls="sidebar"
                aria-expanded="false" aria-label="Open menu">☰</button>
        <p class="topbar__title" id="topbar-title"></p>
        <button type="button" class="icon-btn" data-theme-toggle aria-label="Toggle color theme">
          <span data-theme-icon aria-hidden="true">☀</span>
        </button>
      </header>
      <main id="main" class="content" tabindex="-1"></main>
    </div>
  </div>
</body>
</html>

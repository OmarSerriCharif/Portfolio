<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Dashboard</title>
  <link rel="icon" href="../assets/img/favicon.png" type="image/png">
  <script src="../js/theme-init.js"></script>
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/dashboard.css">
  <script type="module" src="../js/admin/dashboard.js"></script>
</head>
<body class="admin-body">
  <a class="skip-link" href="#view">Skip to content</a>

  <div id="boot" class="login-page">
    <div class="state" role="status" style="border:0;color:var(--brand-secondary)">
      <span class="spinner" aria-hidden="true"></span>
      <p>Checking your session…</p>
    </div>
  </div>

  <div id="app" class="admin-shell" hidden>
    <aside id="sidebar" class="sidebar" aria-label="Sidebar">
      <a class="sidebar__brand" href="#/overview">
        <img id="sidebar-logo" alt="" hidden>
        <span id="sidebar-name">Dashboard</span>
      </a>
      <div data-slot="nav"></div>
      <div class="sidebar__footer">
        <ul class="sidebar__list" role="list">
          <li><a class="sidebar__link" href="../index.html" target="_blank" rel="noopener">View website</a></li>
        </ul>
      </div>
    </aside>
    <div id="sidebar-backdrop" class="sidebar-backdrop"></div>

    <div class="admin-main">
      <header class="topbar">
        <button id="menu-toggle" type="button" class="icon-btn menu-toggle" aria-controls="sidebar" aria-expanded="false" aria-label="Toggle navigation">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
        </button>
        <h1 id="topbar-title" class="topbar__title">Dashboard</h1>
        <div class="topbar__user">
          <span id="user-email" class="topbar__email"></span>
          <button id="logout" type="button" class="btn btn--outline btn--sm">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
            Log out
          </button>
        </div>
      </header>
      <main id="view" class="view" tabindex="-1"></main>
    </div>
  </div>
</body>
</html>

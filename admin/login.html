<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self'; img-src 'self' data: https:; connect-src 'self' https://*.supabase.co wss://*.supabase.co; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'">
  <title>Admin sign in</title>
  <script src="../js/theme-init.js"></script>
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/dashboard.css">
  <script type="module" src="../js/admin/login.js"></script>
</head>
<body class="login-page">
  <a class="skip-link" href="#login-form">Skip to sign-in form</a>

  <button type="button" class="icon-btn login-page__theme" data-theme-toggle aria-label="Toggle color theme">
    <span data-theme-icon aria-hidden="true">☀</span>
  </button>

  <main class="login-card">
    <div class="login-card__header">
      <span class="login-card__mark" aria-hidden="true">◆</span>
      <h1 class="login-card__title">Admin sign in</h1>
      <p class="login-card__subtitle">Manage your portfolio content.</p>
    </div>

    <p id="login-alert" class="alert alert--error" role="alert" hidden></p>

    <form id="login-form" class="form-grid" novalidate>
      <div class="field">
        <label class="field__label" for="login-email">Username (email)</label>
        <input class="input" id="login-email" name="email" type="email" autocomplete="username"
               inputmode="email" spellcheck="false" maxlength="254" required aria-describedby="login-email-error">
        <p class="field__error" id="login-email-error" hidden></p>
      </div>

      <div class="field">
        <label class="field__label" for="login-password">Password</label>
        <div class="input-group">
          <input class="input" id="login-password" name="password" type="password" autocomplete="current-password"
                 maxlength="72" required aria-describedby="login-password-error">
          <button type="button" class="btn btn--ghost btn--sm input-group__btn" id="toggle-password"
                  aria-controls="login-password" aria-pressed="false">Show</button>
        </div>
        <p class="field__error" id="login-password-error" hidden></p>
      </div>

      <button type="submit" class="btn btn--primary btn--block">Sign in</button>
    </form>

    <a class="login-card__back" href="../index.html">← Back to the site</a>
  </main>
</body>
</html>

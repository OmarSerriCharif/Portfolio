<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Admin sign in</title>
  <link rel="icon" href="../assets/img/favicon.png" type="image/png">
  <script src="../js/theme-init.js"></script>
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/dashboard.css">
  <script type="module" src="../js/admin/login.js"></script>
</head>
<body>
  <main class="login-page">
    <div class="login-card">
      <div class="login-card__brand">
        <svg viewBox="0 0 24 24" width="40" height="40" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="color:var(--accent-strong)"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
        <h1>Admin sign in</h1>
        <p class="muted">Sign in with your admin email address.</p>
      </div>

      <div id="login-status" style="margin-bottom:var(--space-4)"></div>

      <form id="login-form" class="form" novalidate>
        <div class="field">
          <label for="email">Email</label>
          <input id="email" name="email" type="email" class="input" autocomplete="username" required maxlength="254" aria-describedby="email-error">
          <span id="email-error" class="field__error" aria-live="polite"></span>
        </div>
        <div class="field">
          <label for="password">Password</label>
          <div class="password-field">
            <input id="password" name="password" type="password" class="input" autocomplete="current-password" required maxlength="72" aria-describedby="password-error">
            <button id="toggle-password" type="button" class="icon-btn icon-btn--sm" aria-label="Show password" aria-pressed="false">
              <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
          <span id="password-error" class="field__error" aria-live="polite"></span>
        </div>
        <button type="submit" class="btn btn--block">Sign in</button>
        <div class="login-links">
          <a href="../index.html">← Back to website</a>
          <button id="show-reset" type="button" class="link-button">Forgot password?</button>
        </div>
      </form>

      <form id="reset-form" class="form" novalidate hidden>
        <p class="muted">Enter your admin email and we’ll send a password reset link.</p>
        <div class="field">
          <label for="reset_email">Email</label>
          <input id="reset_email" name="reset_email" type="email" class="input" autocomplete="username" required maxlength="254" aria-describedby="reset_email-error">
          <span id="reset_email-error" class="field__error" aria-live="polite"></span>
        </div>
        <button type="submit" class="btn btn--block">Send reset link</button>
        <div class="login-links"><button type="button" class="link-button" data-back>← Back to sign in</button></div>
      </form>

      <form id="recovery-form" class="form" novalidate hidden>
        <p class="muted">Choose a new password (at least 10 characters with upper-case, lower-case letters and a number).</p>
        <div class="field">
          <label for="new_password">New password</label>
          <input id="new_password" name="new_password" type="password" class="input" autocomplete="new-password" required minlength="10" maxlength="72" aria-describedby="new_password-error">
          <span id="new_password-error" class="field__error" aria-live="polite"></span>
        </div>
        <div class="field">
          <label for="confirm_password">Confirm new password</label>
          <input id="confirm_password" name="confirm_password" type="password" class="input" autocomplete="new-password" required maxlength="72">
        </div>
        <button type="submit" class="btn btn--block">Set new password</button>
        <div class="login-links"><button type="button" class="link-button" data-back>← Back to sign in</button></div>
      </form>
    </div>
  </main>
</body>
</html>
